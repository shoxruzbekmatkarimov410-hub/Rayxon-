<script>
(function () {
  "use strict";

  /* ---------- Asosiy sozlamalar ---------- */
  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");

  var W = 0, H = 0, dpr = 1, fs = 10, cw = 6, ch = 11, cols = 0, rows = 0, sc = 100;
  var zbuf, chbuf, crb, cgb, cbb;

  var NR = 19;               // atirgullar soni
  var RD = 1.35;             // atirgullar gumbazi radiusi
  var CY = -0.35;            // gumbaz markazi (balandlik)
  var TH = 98 * Math.PI / 180;
  var YMIN = -2.8, YMAX = 1.3;
  var DCAM = 8;              // kamera masofasi

  // harflar: yorug'likka qarab (xira -> yorqin)
  var RAMP = ".,:;-_~=+!/|\\()<>{}[]*rtjfxnuvczXYUJCLQ0OZmwqpdbkhao#MW&8%B@$";
  var RL = RAMP.length;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    fs = Math.max(5.5, Math.min(12, sc * 0.065));
    ctx.font = fs + "px Consolas, Menlo, 'DejaVu Sans Mono', monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ch = fs * 1.15;

    rows = Math.ceil(H / ch);
    var n = cols * rows;
    zbuf = new Float32Array(n);
    chbuf = new Uint16Array(n);
    crb = new Uint8Array(n);
    cgb = new Uint8Array(n);
    cbb = new Uint8Array(n);
  }

  /* ---------- Tasodifiy sonlar (har safar bir xil guldasta) ---------- */
  function mk(seed) {
    return function () {
      seed |= 0;
      seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var R = mk(20261117);

  function nrm(v) {
    var l = Math.sqrt(v[0] * v[0] + v[1] * v[1] + v[2] * v[2]) || 1;
    return [v[0] / l, v[1] / l, v[2] / l];
  }
  function cross(a, b) {
    return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  }

  /* ---------- Statik nuqtalar (qog'oz, barglar, poyalar, lenta) ---------- */
  var SD = [];
  function add(x, y, z, nx, ny, nz, r, g, b, key, edge) {
    SD.push(x, y, z, nx, ny, nz, r, g, b, R(), key, edge ? 1 : 0);
  }

  function leaf(bx, by, bz, dir, len, wid, droop, col, nu, nw) {
    for (var iu = 0; iu <= nu; iu++) {
      var u = iu / nu;
      var px = bx + dir[0] * len * u;
      var py = by + dir[1] * len * u - droop * len * u * u;
      var pz = bz + dir[2] * len * u;
      var T = nrm([dir[0], dir[1] - 2 * droop * u, dir[2]]);
      var S = cross(T, [0, 1, 0]);
      if (Math.sqrt(S[0] * S[0] + S[1] * S[1] + S[2] * S[2]) < 0.05) S = [1, 0, 0];
      S = nrm(S);
      var N = nrm(cross(S, T));
      var wd = wid * Math.pow(Math.sin(Math.PI * Math.pow(u, 0.8)), 0.9);
      for (var iw = 0; iw <= nw; iw++) {
        var w = iw / nw * 2 - 1;
        var cup = 0.18 * wd * w * w;
        var rib = Math.abs(w) < 0.14 ? 1.25 : 1;
        add(
          px + S[0] * w * wd + N[0] * cup,
          py + S[1] * w * wd + N[1] * cup,
          pz + S[2] * w * wd + N[2] * cup,
          N[0], N[1], N[2],
          Math.min(255, col[0] * rib), Math.min(255, col[1] * rib), Math.min(255, col[2] * rib),
          by, Math.abs(w) > 0.8
        );
      }
    }
  }

  function tube(p0, p1, p2, rad, steps, col) {
    for (var i = 0; i <= steps; i++) {
      var u = i / steps, o = 1 - u;
      var px = o * o * p0[0] + 2 * o * u * p1[0] + u * u * p2[0];
      var py = o * o * p0[1] + 2 * o * u * p1[1] + u * u * p2[1];
      var pz = o * o * p0[2] + 2 * o * u * p1[2] + u * u * p2[2];
      var T = nrm([
        2 * o * (p1[0] - p0[0]) + 2 * u * (p2[0] - p1[0]),
        2 * o * (p1[1] - p0[1]) + 2 * u * (p2[1] - p1[1]),
        2 * o * (p1[2] - p0[2]) + 2 * u * (p2[2] - p1[2])
      ]);
      var S = cross(T, [1, 0, 0]);
      if (Math.sqrt(S[0] * S[0] + S[1] * S[1] + S[2] * S[2]) < 0.05) S = cross(T, [0, 0, 1]);

      var N = nrm(cross(T, S));

          py + (S[1] * cx + N[1] * sx) * rad,
          pz + (S[2] * cx + N[2] * sx) * rad,
          S[0] * cx + N[0] * sx, S[1] * cx + N[1] * sx, S[2] * cx + N[2] * sx,
          col[0], col[1], col[2], py, false
        );
      }
    }
  }

  // --- atirgullar joylashuvi (gumbaz ustida) ---
  var roses = [];
  (function () {
    var perm = [], i, j, tmp;

        dir: dir, U: U, V: V,
        px: RD * dir[0], py: CY + RD * dir[1], pz: RD * dir[2],
        size: 0.6 + R() * 0.08,
        col: col,
        tOpen: 5.8 + perm[k] * 0.55
      });
    }
  })();
  var T_ALL_OPEN = 5.8 + (NR - 1) * 0.55 + 1.6;

  // --- qog'oz (siyrak, shaffof ko'rinish uchun) ---
  var WY = -1.5, TY = 0.9;
  // qog'ozning old tomoni (kameraga qaragan) pastroq kesilgan, shunda atirgullar ko'rinib turadi
  function paperTop(a) {
    var s = Math.sin(a);
    return 1 - 0.62 * Math.pow(Math.max(0, s), 1.2);
  }
  (function () {
    var ia, iv, a, v, vt, rr, y, n;
    for (ia = 0; ia < 170; ia++) {
      a = ia / 170 * Math.PI * 2;
      vt = paperTop(a);
      for (iv = 0; iv <= 36; iv++) {
        v = 0.1 + (vt - 0.1) * iv / 36;
        if (R() > 0.38) continue;
        rr = 0.12 + (1.95 + 0.15 * Math.cos(2 * a + 0.5) + 0.06 * Math.cos(9 * a)) * Math.pow(v, 0.8);
        y = WY + v * (TY - WY) + 0.07 * Math.cos(9 * a) * Math.pow(v, 8);
        n = nrm([Math.cos(a), -0.6, Math.sin(a)]);
        add(rr * Math.cos(a), y, rr * Math.sin(a), n[0], n[1], n[2], 150, 152, 158, y, iv > 33);
      }
    }
    // qog'oz chetining yorqin konturi
    for (ia = 0; ia < 320; ia++) {
      a = ia / 320 * Math.PI * 2;
      v = paperTop(a);
      rr = 0.12 + (1.95 + 0.15 * Math.cos(2 * a + 0.5) + 0.06 * Math.cos(9 * a)) * Math.pow(v, 0.8);
      y = WY + v * (TY - WY) + 0.07 * Math.cos(9 * a) * Math.pow(v, 8);
      n = nrm([Math.cos(a), 0.3, Math.sin(a)]);
      add(rr * Math.cos(a), y, rr * Math.sin(a), n[0], n[1], n[2], 195, 195, 205, y, true);
    }
  })();

  // --- tutqich (oltin lenta) va kamon ---
  (function () {
    var gold = [236, 172, 40], ia, iy, a, y;
    for (ia = 0; ia < 30; ia++) {
      for (iy = 0; iy <= 10; iy++) {
        a = ia / 30 * Math.PI * 2;
        y = -2.05 + 0.55 * iy / 10;
        add(0.2 * Math.cos(a), y, 0.2 * Math.sin(a), Math.cos(a), 0, Math.sin(a), gold[0], gold[1], gold[2], y, false);
      }
    }
    leaf(0, -1.5, 0.22, nrm([1, 0.35, 0.35]), 0.5, 0.2, 0, gold, 18, 7);
    leaf(0, -1.5, 0.22, nrm([-1, 0.35, 0.35]), 0.5, 0.2, 0, gold, 18, 7);
    leaf(0, -1.55, 0.24, nrm([0.4, -1, 0.35]), 0.55, 0.1, 0, gold, 18, 5);
    leaf(0, -1.55, 0.24, nrm([-0.4, -1, 0.35]), 0.55, 0.1, 0, gold, 18, 5);
  })();

  // --- poyalar ---
  (function () {
    var k, ang, p0, p1, p2, dir, green = [45, 150, 60];
    for (k = 0; k < 9; k++) {
      ang = 1.7 * k;
      p0 = [0.05 * Math.sin(ang), -1.5, 0.05 * Math.cos(ang)];
      p2 = [0.14 * Math.sin(ang), -2.75, 0.14 * Math.cos(ang)];
      p1 = [(p0[0] + p2[0]) / 2, (p0[1] + p2[1]) / 2, (p0[2] + p2[2]) / 2];
      tube(p0, p1, p2, 0.03, 26, green);
    }
    for (k = 0; k < 12; k++) {
      dir = roses[k].dir;
      p0 = [0, -1.5, 0];
      p2 = [(RD - 0.25) * dir[0], CY + (RD - 0.25) * dir[1], (RD - 0.25) * dir[2]];
      p1 = [p2[0] * 0.2, (p0[1] + p2[1]) / 2, p2[2] * 0.2];
      tube(p0, p1, p2, 0.025, 24, [50, 140, 60]);
    }
  })();

  // --- barglar ---
  (function () {
    var i, th, ph, dir, bx, by, bz, g, len, d;
    // tashqi katta barglar (gumbaz chetidan tashqariga)
    for (i = 0; i < 22; i++) {
      ph = i / 22 * Math.PI * 2 + (R() - 0.5) * 0.3;
      th = (88 + R() * 20) * Math.PI / 180;
      dir = [Math.sin(th) * Math.cos(ph), Math.cos(th), Math.sin(th) * Math.sin(ph)];
      bx = RD * 1.0 * dir[0]; by = CY + RD * 1.0 * dir[1]; bz = RD * 1.0 * dir[2];
      d = nrm([dir[0], dir[1] * 0.3 - 0.1, dir[2]]);
      len = 0.5 + R() * 0.35;
      g = [30 + R() * 30, 150 + R() * 35, 55 + R() * 25];
      leaf(bx, by, bz, d, len, 0.22 + R() * 0.08, 0.45, g, 22, 8);
    }
    // kichik barglar (atirgullar orasidan ko'rinadi)
    for (i = 0; i < 26; i++) {
      ph = R() * Math.PI * 2;
      th = (25 + R() * 70) * Math.PI / 180;
      dir = [Math.sin(th) * Math.cos(ph), Math.cos(th), Math.sin(th) * Math.sin(ph)];
      bx = (RD - 0.4) * dir[0]; by = CY + (RD - 0.4) * dir[1]; bz = (RD - 0.4) * dir[2];
      d = nrm([dir[0], dir[1] * 0.8, dir[2]]);
      g = [30 + R() * 30, 140 + R() * 40, 55 + R() * 25];
      leaf(bx, by, bz, d, 0.42, 0.15, 0.2, g, 12, 5);
    }
  })();

  var SDF = new Float32Array(SD);
  var NS = SDF.length / 12;
  SD = null;

  /* ---------- Kamera va yorug'lik ---------- */
  var cyw = 1, syw = 0, cp = 1, sp = 0;
  var LX = -0.45, LY = 0.75, LZ = 0.55;
  (function () {
    var l = Math.sqrt(LX * LX + LY * LY + LZ * LZ);
    LX /= l; LY /= l; LZ /= l;
  })();

  function setCamera(t) {
    var yaw = 0.5 * Math.sin(t * 0.35);
    var pit = 0.15 + 0.05 * Math.sin(t * 0.27);
    cyw = Math.cos(yaw); syw = Math.sin(yaw);
    cp = Math.cos(pit); sp = Math.sin(pit);
  }

  function plot(x, y, z, nx, ny, nz, r, g, b, rn, edge) {
    y += 0.75;
    var x1 = x * cyw + z * syw;
    var z1 = -x * syw + z * cyw;
    var y1 = y * cp - z1 * sp;
    var z2 = y * sp + z1 * cp;
    var d = DCAM - z2;
    if (d < 1) return;
    var pr = DCAM / d;
    var col = ((W * 0.5 + x1 * sc * pr) / cw) | 0;
    var row = ((H * 0.5 - y1 * sc * pr) / ch) | 0;
    if (col < 0 || col >= cols || row < 0 || row >= rows) return;
    var idx = row * cols + col;
    if (z2 <= zbuf[idx]) return;

    var a1 = nx * cyw + nz * syw;
    var c1 = -nx * syw + nz * cyw;
    var b1 = ny * cp - c1 * sp;
    var c2 = ny * sp + c1 * cp;
    if (c2 < 0) { a1 = -a1; b1 = -b1; c2 = -c2; }
    var dl = a1 * LX + b1 * LY + c2 * LZ;
    if (dl < 0) dl = 0;
    var lum = 0.4 + 0.6 * dl;

    var code;
    if (edge && c2 < 0.3 && rn < 0.6) {
      var an = Math.atan2(b1, a1);
      if (an < 0) an += Math.PI;
      if (an < 0.3927 || an >= 2.7489) code = 124;        // |
      else if (an < 1.1781) code = 92;                    // \
      else if (an < 1.9635) code = 45;                    // -
      else code = 47;                                     // /
    } else {
      var q = lum * 0.95 + (rn - 0.5) * 0.4;
      if (q < 0) q = 0;
      if (q > 0.999) q = 0.999;
      code = RAMP.charCodeAt((q * RL) | 0);
    }

    zbuf[idx] = z2;
    chbuf[idx] = code;
    var f = 0.25 + 0.95 * lum;
    var rr = r * f, gg = g * f, bb = b * f;
    crb[idx] = rr > 255 ? 255 : rr;
    cgb[idx] = gg > 255 ? 255 : gg;
    cbb[idx] = bb > 255 ? 255 : bb;
  }

  /* ---------- Yulduzlar ---------- */
  var STARS = [], FLARES = [], si;
  for (si = 0; si < 460; si++) {
    var rr0 = R();
    STARS.push({
      x: R(), y: R(), p: R() * 6.283, s: 0.6 + R() * 2.2, t: R(),
      c: rr0 < 0.6 ? "." : (rr0 < 0.85 ? "+" : "*")
    });
  }
  for (si = 0; si < 6; si++) {
    FLARES.push({ x: 0.05 + R() * 0.9, y: 0.05 + R() * 0.9, p: R() * 6.283, s: 0.7 + R() * 1.2 });
  }

  function drawStars(t) {
    var i, s, a;
    ctx.font = Math.max(8, fs * 1.2) + "px monospace";
    for (i = 0; i < STARS.length; i++) {
      s = STARS[i];
      a = 0.2 + 0.6 * (0.5 + 0.5 * Math.sin(t * s.s + s.p));
      ctx.fillStyle = "rgba(" + (s.t < 0.15 ? "180,200,255" : (s.t < 0.3 ? "255,228,200" : "255,255,255")) +
                      "," + a.toFixed(2) + ")";
      ctx.fillText(s.c, s.x * W, s.y * H);
    }
    ctx.lineWidth = 1;
    for (i = 0; i < FLARES.length; i++) {
      s = FLARES[i];
      a = 0.5 + 0.5 * Math.sin(t * s.s + s.p);
      var cx = s.x * W, cy = s.y * H, L = 10 + 26 * a;
      ctx.strokeStyle = "rgba(255,255,255," + (0.25 + 0.55 * a).toFixed(2) + ")";
      ctx.beginPath();
      ctx.moveTo(cx - L, cy); ctx.lineTo(cx + L, cy);
      ctx.moveTo(cx, cy - L); ctx.lineTo(cx, cy + L);
      ctx.stroke();
      ctx.strokeStyle = "rgba(255,255,255," + (0.12 + 0.3 * a).toFixed(2) + ")";
      ctx.beginPath();
      ctx.moveTo(cx - L * 0.45, cy - L * 0.45); ctx.lineTo(cx + L * 0.45, cy + L * 0.45);
      ctx.moveTo(cx - L * 0.45, cy + L * 0.45); ctx.lineTo(cx + L * 0.45, cy - L * 0.45);
      ctx.stroke();
    }
    ctx.font = fs + "px Consolas, Menlo, 'DejaVu Sans Mono', monospace";
  }

  /* ---------- Oltin chang (guldasta atrofida yuqoriga ko'tariladi) ---------- */
  var DUST = [], di;
  for (di = 0; di < 70; di++) {
    DUST.push({ x: (R() - 0.5) * 4.2, y0: R() * 4.6, v: 0.15 + R() * 0.3, p: R() * 6.283, c: R() < 0.5 ? "." : "*" });
  }

  function drawDust(t) {
    if (t < 5) return;
    var fade = Math.min(1, (t - 5) / 3);
    var i, d, y, a;
    for (i = 0; i < DUST.length; i++) {
      d = DUST[i];
      y = ((d.y0 + t * d.v) % 4.6) - 2.8;
      a = fade * (0.25 + 0.65 * (0.5 + 0.5 * Math.sin(t * 2.2 + d.p)));
      ctx.fillStyle = "rgba(255,215,120," + a.toFixed(2) + ")";
      ctx.fillText(d.c, W * 0.5 + (d.x + 0.12 * Math.sin(t * 0.8 + d.p)) * sc, H * 0.5 - (y + 0.75) * sc);
    }
  }

  /* ---------- Atirgul (har kadrda qayta hisoblanadi) ---------- */
  function drawRose(k, open, t) {
    var ro = roses[k];
    var size = ro.size * (0.8 + 0.2 * open);
    var D = ro.dir, U = ro.U, V = ro.V;
    var cr = ro.col[0], cg = ro.col[1], cb = ro.col[2];
    var L = 6, NA = 28, NV = 7;
    for (var j = 0; j < L; j++) {
      var tt = j / (L - 1);
      var bj = 0.18 + 0.135 * j;
      var mixv = open * (0.3 + 0.7 * tt);
      var Hj = 0.62 - 0.06 * j;
      for (var ia = 0; ia < NA; ia++) {
        var a = (ia + 0.5 * (j & 1)) / NA * Math.PI * 2;
        var ca = Math.cos(a), sa = Math.sin(a);
        var wave = 1 + 0.16 * Math.cos(5 * a + j * 1.3 + k);
        for (var iv = 0; iv < NV; iv++) {
          var v = (iv + 0.5) / NV;
          var bell = Math.sin(Math.PI * (0.15 + 0.8 * v));
          var flare = 0.35 + 1.15 * v;
          var r = bj * size * (bell * (1 - mixv) + flare * mixv) * wave;
          var hgt = size * Hj * v * (1 - 0.55 * open * tt);
          var lx = r * ca, ly = hgt, lz = r * sa;
          var ny = (1 - mixv) * 1.8 * (v - 0.45) + mixv * -0.6;
          var nl = Math.sqrt(1 + ny * ny);
          var nxl = ca / nl, nyl = ny / nl, nzl = sa / nl;
          var shade = 0.55 + 0.45 * (0.4 * tt + 0.6 * v);
          // barg chetlari ochroq (yorug'lik tushgandek)
          var hl = v > 0.78 ? (v - 0.78) / 0.22 * (0.3 + 0.4 * tt) : 0;
          var rr_ = Math.min(255, cr * shade * 1.2);
          var gg_ = Math.min(255, cg * shade * 1.2);
          var bb_ = Math.min(255, cb * shade * 1.2);
          rr_ += (255 - rr_) * hl * 0.5;
          gg_ += (255 - gg_) * hl * 0.5;
          bb_ += (255 - bb_) * hl * 0.5;
          var rn = ((ia * 73856093) ^ (iv * 19349663) ^ (j * 83492791) ^ (k * 2654435761)) >>> 0;
          rn = rn / 4294967296;
          plot(
            ro.px + U[0] * lx + D[0] * ly + V[0] * lz,
            ro.py + U[1] * lx + D[1] * ly + V[1] * lz,
            ro.pz + U[2] * lx + D[2] * ly + V[2] * lz,
            U[0] * nxl + D[0] * nyl + V[0] * nzl,
            U[1] * nxl + D[1] * nyl + V[1] * nzl,
            U[2] * nxl + D[2] * nyl + V[2] * nzl,
            rr_, gg_, bb_, rn, true
          );
        }
      }
    }
  }

  /* ---------- Tushayotgan gul barglari ---------- */
  var petals = [];
  var spawnAcc = 0;

  function spawnPetal() {
    var k = Math.floor(Math.random() * NR);
    var ro = roses[k];
    petals.push({
      x: ro.px + (Math.random() - 0.5) * 0.3,
      y: ro.py + 0.1,
      z: ro.pz + (Math.random() - 0.5) * 0.3,
      v: 0.3 + Math.random() * 0.25,
      ph: Math.random() * 6.283,
      rot: Math.random() * 6.283,
      sp: 1 + Math.random() * 2,
      col: ro.col
    });
  }

  function updatePetals(dt, t) {
    var i, p;
    for (i = petals.length - 1; i >= 0; i--) {
      p = petals[i];
      p.y -= p.v * dt;
      p.x += 0.12 * Math.sin(t * 2 + p.ph) * dt;
      p.z += 0.08 * Math.cos(t * 1.6 + p.ph) * dt;
      p.rot += p.sp * dt;
      if (p.y < -3.0) petals.splice(i, 1);
    }
  }

  function drawPetals() {
    for (var i = 0; i < petals.length; i++) {
      var p = petals[i];
      var cr = Math.cos(p.rot), sr = Math.sin(p.rot);
      for (var q = 0; q < 8; q++) {
        var an = q / 8 * Math.PI * 2;
        var ex = 0.12 * Math.cos(an) * (q === 7 ? 0 : 1);
        var ez = 0.07 * Math.sin(an) * (q === 7 ? 0 : 1);
        plot(
          p.x + ex * cr,
          p.y + ex * sr * 0.6,
          p.z + ez,
          sr * 0.7, 0.7, cr * 0.4 + 0.3,
          p.col[0], p.col[1], p.col[2], q / 8, false
        );
      }
    }
  }

  /* ---------- Qo'shiq matni (gul tagida) ----------
     Format: [soniya, "matn"] — soniya musiqaning (10 s kesilgandan keyingi) boshidan hisoblanadi */
  var LYRICS = [
    // [0, "Birinchi qator"],
    // [5.5, "Ikkinchi qator"],
  ];
  function drawLyrics() {
    if (!LYRICS.length) return;
    var ct = music.currentTime || 0, cur = -1, i;
    for (i = 0; i < LYRICS.length; i++) if (LYRICS[i][0] <= ct) cur = i;
    if (cur < 0) return;
    var line = LYRICS[cur][1];
    var age = ct - LYRICS[cur][0];
    var a = Math.min(1, age / 0.35);
    var size = Math.max(14, Math.min(26, W * 0.045));
    ctx.save();
    ctx.font = "italic " + size + "px Georgia, 'Times New Roman', serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    var y = Math.min(H - 56, H * 0.5 + 2.3 * sc);
    ctx.shadowColor = "rgba(255,60,90,0.8)";
    ctx.shadowBlur = 12;
    ctx.fillStyle = "rgba(255,225,232," + a.toFixed(3) + ")";
    ctx.fillText(line, W * 0.5, y, W * 0.92);
    ctx.restore();
  }

  /* ---------- Asosiy sikl ---------- */
  var skip = 0;
  try { skip = parseFloat(new URLSearchParams(location.search).get("t")) || 0; } catch (e) {}
  var t0 = performance.now() - skip * 1000;
  var last = performance.now();

  // musiqa va "Boshlash" ekrani
  var started = skip > 0;
  var music = document.getElementById("music");
  var startEl = document.getElementById("start");
  var muteBtn = document.getElementById("mute");
  if (started) startEl.style.display = "none";

  function playMusic() {
    try {
      var p = music.play();
      if (p && p.catch) p.catch(function () {});
    } catch (e) {}
  }

  startEl.addEventListener("click", function () {
    if (started) return;
    started = true;
    t0 = performance.now();
    startEl.style.display = "none";
    playMusic();
  });

  muteBtn.addEventListener("click", function () {
    music.muted = !music.muted;
    muteBtn.innerHTML = music.muted ? "&#128263;" : "&#128266;";
  });

  // music.mp3 fayli yo'q bo'lsa, ovoz tugmasi yashiriladi
  music.addEventListener("error", function () {
    muteBtn.style.display = "none";
  });

  function frame(now) {
    var t = started ? Math.max(0, (now - t0) / 1000) : 0;
    var dt = Math.min(0.1, (now - last) / 1000);
    last = now;

    var bgr = ctx.createRadialGradient(W * 0.5, H * 0.42, 0, W * 0.5, H * 0.42, Math.max(W, H) * 0.75);
    bgr.addColorStop(0, "#1c0b22");
    bgr.addColorStop(0.5, "#0a0512");
    bgr.addColorStop(1, "#000");
    ctx.fillStyle = bgr;
    ctx.fillRect(0, 0, W, H);
    drawStars(t);

    setCamera(t);
    zbuf.fill(-1e9);
    chbuf.fill(0);

    // o'sish: pastdan yuqoriga
    var G = Math.min(1, t / 5.2);
    var e = 1 - Math.pow(1 - G, 3);
    var cutY = YMIN + e * (YMAX - YMIN) + 0.001;

    var i, o;
    for (i = 0; i < NS; i++) {
      o = i * 12;
      var kk = SDF[o + 10];
      if (kk > cutY) continue;
      var rnv = SDF[o + 9], pr1 = SDF[o + 6], pg1 = SDF[o + 7], pb1 = SDF[o + 8];
      // o'sayotgan chekkada harflar yonib-miltillaydi
      if (G < 1 && cutY - kk < 0.3) {
        rnv = Math.random();
        pr1 = Math.min(255, pr1 + 70); pg1 = Math.min(255, pg1 + 90); pb1 = Math.min(255, pb1 + 70);
      }
      plot(SDF[o], SDF[o + 1], SDF[o + 2], SDF[o + 3], SDF[o + 4], SDF[o + 5],
           pr1, pg1, pb1, rnv, SDF[o + 11] > 0.5);
    }

    var openCount = 0;
    for (i = 0; i < NR; i++) {
      if (roses[i].py > cutY) continue;
      var x = (t - roses[i].tOpen) / 1.6;
      if (x < 0) x = 0;
      if (x > 1) x = 1;
      var op = x * x * (3 - 2 * x);
      if (op > 0.5) openCount++;
      drawRose(i, op, t);
    }

    // barglar tusha boshlaydi
    if (t > T_ALL_OPEN + 0.8) {
      spawnAcc += dt * 3.6;
      while (spawnAcc >= 1) { spawnAcc -= 1; spawnPetal(); }
    }
    updatePetals(dt, t);
    drawPetals();

    // atirgullar orqasida yumshoq qizil nur
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    var gcy = H * 0.5 - 0.9 * sc;
    var gl = ctx.createRadialGradient(W * 0.5, gcy, 0, W * 0.5, gcy, sc * 1.9);
    var ga = 0.16 * Math.min(1, Math.max(0, (t - 3) / 4));
    gl.addColorStop(0, "rgba(255,60,90," + ga.toFixed(3) + ")");
    gl.addColorStop(1, "rgba(255,60,90,0)");
    ctx.fillStyle = gl;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    // harflarni chizish
    var cnt = 0, row, col, idx, c;
    ctx.font = "bold " + fs + "px Consolas, Menlo, 'DejaVu Sans Mono', monospace";
    for (row = 0; row < rows; row++) {
      for (col = 0; col < cols; col++) {
        idx = row * cols + col;
        c = chbuf[idx];
        if (!c) continue;
        cnt++;
        ctx.fillStyle = "rgb(" + crb[idx] + "," + cgb[idx] + "," + cbb[idx] + ")";
        ctx.fillText(String.fromCharCode(c), (col + 0.5) * cw, (row + 0.5) * ch);
      }
    }

    drawDust(t);
    drawLyrics();

    // yozuvlar
    ctx.save();
    ctx.font = "12px Consolas, Menlo, 'DejaVu Sans Mono', monospace";
    ctx.textAlign = "right";
    ctx.textBaseline = "top";
    ctx.fillStyle = "#ff7a9a";
    ctx.fillText("t " + t.toFixed(2) + "s", W - 14, 12);
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
    ctx.fillStyle = "rgba(205,205,215,0.75)";
    var line1 = G < 1
      ? "growing  " + (G * 100).toFixed(1) + "%"
      : "roses open " + openCount + "/" + NR + "    petals falling " + petals.length;
    ctx.fillText(line1, 14, H - 30);
    ctx.fillText("letters " + cnt.toLocaleString("en-US"), 14, H - 14);
    ctx.restore();

    requestAnimationFrame(frame);
  }

  // bosilganda animatsiya boshidan qaytadan boshlanadi
  canvas.addEventListener("click", function () {
    t0 = performance.now();
    petals.length = 0;
    spawnAcc = 0;
    try { music.currentTime = 0; } catch (e) {}
  });

  window.addEventListener("resize", resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
