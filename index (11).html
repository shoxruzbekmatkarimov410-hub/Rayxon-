<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yurak</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    width: min(100vw, 100vh);
    height: min(100vw, 100vh);
    background: #000;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
(function () {
  var SIZE = 700;
  var canvas = document.getElementById("c");
  var dpr = Math.min(window.devicePixelRatio || 1, 3);
  canvas.width = SIZE * dpr;
  canvas.height = SIZE * dpr;
  var ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, SIZE, SIZE);
  ctx.lineCap = "round";

  function uniform(a, b) {
    return a + Math.random() * (b - a);
  }

  // Python: def heart(a, scale)
  function heart(a, scale) {
    var x = 16 * Math.pow(Math.sin(a), 3) * scale;
    var y = (13 * Math.cos(a) - 5 * Math.cos(2 * a) -
             2 * Math.cos(3 * a) - Math.cos(4 * a)) * scale;
    return [x, y];
  }

  // turtle koordinatasi (markaz 0,0, y yuqoriga) -> canvas koordinatasi
  function cx(x) { return SIZE / 2 + x; }
  function cy(y) { return SIZE / 2 - y; }

  function strand(x1, y1, x2, y2, r, g, b, w) {
    ctx.strokeStyle = "rgb(" + Math.round(r * 255) + "," +
                      Math.round(g * 255) + "," +
                      Math.round(b * 255) + ")";
    ctx.lineWidth = w;
    ctx.beginPath();
    ctx.moveTo(cx(x1), cy(y1));
    ctx.lineTo(cx(x2), cy(y2));
    ctx.stroke();
  }

  // 1-bosqich: yurak ichini to'ldirish (range(10000))
  function drawInner() {
    var a = uniform(0, 2 * Math.PI);
    var sc = uniform(0.5, 15.5);
    var p = heart(a, sc);
    var x = p[0], y = p[1];

    var ang = Math.atan2(y, x) + uniform(-0.5, 0.5);
    var length = uniform(4, 14);

    strand(
      x, y,
      x + length * Math.cos(ang), y + length * Math.sin(ang),
      1.0, uniform(0.25, 0.55), uniform(0.65, 0.85),
      uniform(0.5, 1.2)
    );
  }

  // 2-bosqich: yurak chetini chizish (range(3500))
  function drawEdge() {
    var a = uniform(0, 2 * Math.PI);
    var p = heart(a, 16.0);
    var x = p[0], y = p[1];

    var ang = Math.atan2(y, x) + uniform(-0.35, 0.35);
    var length = uniform(10, 32);

    strand(
      x + uniform(-2, 2), y + uniform(-2, 2),
      x + length * Math.cos(ang), y + length * Math.sin(ang),
      1.0, uniform(0.45, 0.75), uniform(0.75, 0.95),
      uniform(0.4, 0.9)
    );
  }

  var TOTAL_INNER = 10000;
  var TOTAL_EDGE = 3500;
  var PER_FRAME_INNER = 50;
  var PER_FRAME_EDGE = 25;

  var done = 0;

  function frame() {
    var k;
    if (done < TOTAL_INNER) {
      for (k = 0; k < PER_FRAME_INNER && done < TOTAL_INNER; k++) {
        drawInner();
        done++;
      }
      requestAnimationFrame(frame);
    } else if (done < TOTAL_INNER + TOTAL_EDGE) {
      for (k = 0; k < PER_FRAME_EDGE && done < TOTAL_INNER + TOTAL_EDGE; k++) {
        drawEdge();
        done++;
      }
      requestAnimationFrame(frame);
    }
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
